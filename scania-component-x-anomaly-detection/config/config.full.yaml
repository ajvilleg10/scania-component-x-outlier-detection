project:
  name: scania-component-x-outlier-detection
  package_name: scania_outliers
  seed: 42
  objective: outlier_detection_multivariate_time_series
  version: 1.2.0
environment:
  platform: google_colab
  use_drive: true
  install_mode: editable
  primary_execution: google_colab_gpu
execution:
  mode: full
  max_vehicles_debug: null
  document_sampling_if_used: true
  save_intermediate_artifacts: true
paths:
  drive_root: /content/drive/MyDrive/TFM_SCANIA
  raw_dir: /content/drive/MyDrive/TFM_SCANIA/data/raw
  raw_dir_alternative: /content/drive/MyDrive/TFM_SCANIA/raw
  processed_dir: /content/drive/MyDrive/TFM_SCANIA/data/processed
  models_dir: /content/drive/MyDrive/TFM_SCANIA/models
  outputs_dir: /content/drive/MyDrive/TFM_SCANIA/outputs
  figures_dir: /content/drive/MyDrive/TFM_SCANIA/outputs/figures
  tables_dir: /content/drive/MyDrive/TFM_SCANIA/outputs/tables
  metrics_dir: /content/drive/MyDrive/TFM_SCANIA/outputs/metrics
  doc_dir: /content/drive/MyDrive/TFM_SCANIA/doc
  experiments_dir: /content/drive/MyDrive/TFM_SCANIA/experiments
dataset:
  vehicle_col: vehicle_id
  time_col: time_step
  files:
    train_operational: train_operational_readouts.csv
    train_tte: train_tte.csv
    train_specifications: train_specifications.csv
    validation_operational: validation_operational_readouts.csv
    validation_labels: validation_labels.csv
    validation_specifications: validation_specifications.csv
    test_operational: test_operational_readouts.csv
    test_labels: test_labels.csv
    test_specifications: test_specifications.csv
  split_strategy:
    type: official_dataset_splits
    train: train
    validation: validation
    test: test
    do_not_resplit: true
    do_not_use_cross_validation: true
  train_label_source: train_tte
  validation_label_source: validation_labels
  test_label_source: test_labels
  label_column_candidates:
  - class_label
  - in_study_repair
  - is_outlier
  - outlier
  - label
  - target
  - is_anomaly
  - anomaly
  - repair
  - failure
  validation_strategy:
    use_official_split: true
    cross_validation: false
    additional_train_split: false
    reason: SCANIA Component X ya proporciona train, validation y test; se respeta
      la particion oficial.
  kaggle:
    dataset_slug: tapanbatla/scania-component-x-dataset-2025
    download_cache: kagglehub_default_cache
    copy_to_raw_dir_required: true
    note: KaggleHub descarga en cache temporal de Colab; los CSV deben copiarse a
      paths.raw_dir antes de ejecutar el pipeline.
spark:
  app_name: ScaniaComponentXOutlierDetection
  master: local[*]
  shuffle_partitions: 4
  driver_memory: 10g
  arrow_enabled: false
  debug_max_to_string_fields: 400
  adaptive_enabled: true
preprocessing:
  id_col: vehicle_id
  time_col: time_step
  max_missing_ratio: 0.8
  fill_strategy: median
  min_variance: 0.0
  fit_preprocessing_on: train
  fit_scaler_on: train
  use_specifications: false
  drop_constant_columns: true
  metadata_file: preprocessing_metadata.json
  exclude_columns:
  - vehicle_id
  - time_step
  - y_true
  - class_label
  - in_study_repair
  scaling_method: scalar_standard
  approximate_quantile_relative_error: 0.05
windowing:
  window_size: 30
  stride: 5
  output_format: parquet
  use_pandas: false
  parquet_partitions: 4
  label_policy: vehicle_label
  aggregation_level: vehicle
  analyze_time_irregularity: true
  min_windows_per_vehicle: 1
modeling:
  framework: pytorch
  batch_size: 128
  epochs: 20
  learning_rate: 0.001
  latent_dim: 64
  hidden_dim: 128
  dropout: 0.1
  early_stopping_patience: 5
  device: auto
  models:
  - lstm_autoencoder
  - cnn_lstm_autoencoder
  - transformer_encoder_simplified
  transformer_encoder_simplified:
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    use_bottleneck: true
    bottleneck_dim: 32
  validation_source: official_validation
  early_stopping_source: official_validation
outlier_detection:
  score_type: reconstruction_error
  threshold_strategy: best_f1_on_validation
  threshold_percentile: 95
  score_column: outlier_score
  prediction_column: is_outlier
  normal_class_name: inlier
  outlier_class_name: outlier
  vehicle_aggregation:
    primary_score: max_score
    additional_scores:
    - mean_score
    - p95_score
    - outlier_window_ratio
evaluation:
  primary_split: test
  validation_split: validation
  primary_level: vehicle
  secondary_level: window
  metrics:
  - precision
  - recall
  - f1_score
  - roc_auc
  - pr_auc
  comparison_fields:
  - model
  - split
  - level
  - threshold
  - precision
  - recall
  - f1_score
  - roc_auc
  - pr_auc
  - training_time_seconds
  - inference_time_seconds
  - n_samples
  - n_outliers
automation:
  main_command: python main.py --config config/config.colab.yaml --stage all --model
    all --mode full
  stages:
  - eda
  - preprocess
  - train
  - evaluate
  - compare
  colab_support: native_python_execution
  notes:
  - Los notebooks quedan como soporte explicativo, no como flujo obligatorio.
  - El flujo oficial se ejecuta desde main.py o desde el comando scania-outliers.
  - No se realiza cross-validation ni particiones adicionales; se respetan train,
    validation y test oficiales.
  - El conjunto test queda reservado exclusivamente para evaluacion final.
  execution_environment: google_colab_drive
eda:
  fast_debug: true
  skip_heavy_operational_reports_in_debug: true
  skip_exact_counts_in_debug: false
optimization:
  early_debug_filter_before_preprocessing: true
  avoid_spark_ml_vector_scaler: true
  avoid_to_pandas: true
  notes:
  - En modo debug se filtran vehiculos antes de imputacion, escalado y windowing.
  - El preprocesamiento usa expresiones escalares de Spark para evitar VectorAssembler/StandardScaler.
  - No se configura spark.sql.execution.arrow.enabled porque esta deprecado desde
    Spark 3.0.
