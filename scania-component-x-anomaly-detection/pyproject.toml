[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scania-outlier"
version = "1.0.0"
description = "Detección de outliers temporales multivariados del dataset SCANIA Component X"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alex Villegas" }]
dependencies = [
    "pyspark>=3.5,<4.0",
    "findspark>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "torch>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
