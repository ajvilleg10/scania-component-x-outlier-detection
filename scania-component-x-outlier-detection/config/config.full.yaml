project:
  name: scania-component-x-outlier-detection
  package_name: scania_outliers
  seed: 42
  objective: outlier_detection_multivariate_time_series
  version: 3.2.0
environment:
  platform: google_colab
  use_drive: true
  primary_execution: google_colab_gpu
execution:
  mode: full
  max_vehicles_debug: null
  debug_min_positive_vehicles: 2
  save_intermediate_artifacts: true
  learning_curve_n_vehicles: 25
  learning_curve_seed: 1
learning_curve:
  sizes: [25, 50, 100, 200]
  n_seeds: 3
  model: lstm_autoencoder
  note: >
    Estudio de curva de aprendizaje para la hipotesis especifica 1 (suficiencia
    de las secuencias preparadas). Solo train se muestrea aleatoriamente por
    tamano/semilla; validation y test permanecen completos en todos los puntos,
    igual que en el run full, que sirve como ancla de tamano completo sin
    repeticiones. Ejecutar con scripts/run_learning_curve.py y consolidar con
    scripts/build_learning_curve_summary.py. Ver docs/learning_curve.md.
paths:
  drive_root: /content/drive/MyDrive/TFM_SCANIA
  raw_dir: /content/drive/MyDrive/TFM_SCANIA/data/raw
  raw_dir_alternative: /content/drive/MyDrive/TFM_SCANIA/raw
  processed_dir: /content/drive/MyDrive/TFM_SCANIA/data/processed
  experiments_dir: /content/drive/MyDrive/TFM_SCANIA/experiments
dataset:
  vehicle_col: vehicle_id
  time_col: time_step
  files:
    train_operational: train_operational_readouts.csv
    train_tte: train_tte.csv
    train_specifications: train_specifications.csv
    validation_operational: validation_operational_readouts.csv
    validation_labels: validation_labels.csv
    validation_specifications: validation_specifications.csv
    test_operational: test_operational_readouts.csv
    test_labels: test_labels.csv
    test_specifications: test_specifications.csv
  split_strategy:
    type: official_dataset_splits
    train: train
    validation: validation
    test: test
    do_not_resplit: true
    do_not_use_cross_validation: true
  train_label_source: train_tte
  validation_label_source: validation_labels
  test_label_source: test_labels
  binary_reference_target:
    train_tte: in_study_repair 0=reference_normal, 1=repaired
    validation_test: class_label 0=reference_negative_gt_48_time_steps, 1_4=positive_within_48_time_steps
    interpretation: Referencia binaria para evaluar deteccion de outliers; no se interpreta como etiqueta puntual intrinseca de anomalia.
  label_column_candidates:
  - class_label
  - in_study_repair
  - is_outlier
  - outlier
  - label
  - target
  - is_anomaly
  - anomaly
  - repair
  - failure
  kaggle:
    dataset_slug: tapanbatla/scania-component-x-dataset-2025
    copy_to_raw_dir_required: true
spark:
  app_name: ScaniaComponentXOutlierDetection
  master: local[*]
  shuffle_partitions: 4
  driver_memory: 8g
  arrow_enabled: false
  debug_max_to_string_fields: 400
  adaptive_enabled: true
eda:
  fast_debug: true
  skip_exact_counts_in_debug: false
  generate_feature_figures: true
  visual_sample_fraction: 0.01
  visual_max_rows: 5000
  visual_max_features: 10
  correlation_max_features: 12
  trajectory_plot_max_vehicles: 5000
  missing_plot_top_n: 25
  note: Las distribuciones, box plots y correlaciones usan una muestra acotada para
    visualizacion; las metricas de modelos no usan esta muestra.
preprocessing:
  id_col: vehicle_id
  time_col: time_step
  max_missing_ratio: 0.8
  fill_strategy: median
  fit_preprocessing_on: train
  fit_scaler_on: train
  use_specifications: false
  drop_constant_columns: true
  exclude_columns:
  - vehicle_id
  - time_step
  - y_true
  - class_label
  - in_study_repair
  scaling_method: scalar_standard_winsorized
  approximate_quantile_relative_error: 0.05
  winsorize:
    enabled: true
    low_percentile: 1.0
    high_percentile: 99.0
    note: Recorta cada variable a su rango [p1, p99] ajustado en train antes de
      estandarizar, para que picos puntuales de sensor no dominen el z-score
      ni, mas adelante, el error de reconstruccion.
windowing:
  window_size: 30
  stride: 5
  output_format: parquet
  use_pandas: false
  parquet_partitions: 4
  label_policy: vehicle_label
  aggregation_level: vehicle
  analyze_time_irregularity: true
  min_windows_per_vehicle: 1
modeling:
  framework: pytorch
  batch_size: 128
  epochs: 20
  learning_rate: 0.001
  latent_dim: 64
  hidden_dim: 128
  dropout: 0.1
  early_stopping_patience: 5
  device: auto
  models:
  - lstm_autoencoder
  - cnn_lstm_autoencoder
  - transformer_encoder
  transformer_encoder:
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    use_bottleneck: true
    bottleneck_dim: 32
  validation_source: official_validation
  early_stopping_source: official_validation
outlier_detection:
  score_type: reconstruction_error
  threshold_strategy: best_f1_on_validation
  threshold_percentile: 95
  score_column: outlier_score
  prediction_column: is_outlier
  normal_class_name: inlier
  outlier_class_name: outlier
  scoring:
    feature_calibrated: true
    calibration_percentile: 90.0
    calibration_max_windows: 20000
    note: El score de una ventana se calcula normalizando el error cuadratico
      de cada variable por una escala robusta calibrada en ventanas normales
      de train, y promediando los canales normalizados. Evita que una
      variable ruidosa domine el score solo por su propia varianza, sin
      diluir una senal real que solo aparezca en un subconjunto de canales.
  vehicle_aggregation:
    primary_score: p95_score
    additional_scores:
    - mean_score
    - max_score
    - outlier_window_ratio
    note: p95_score se usa como score principal en lugar de max_score porque,
      con ventanas solapadas (stride 5 sobre 30 pasos), el maximo por vehiculo
      esta sesgado por el numero de ventanas observadas (a mas ventanas, mayor
      maximo esperable por pura estadistica de extremos, sin relacion con una
      reparacion real). p95 conserva sensibilidad a segmentos anomalos sin
      heredar ese sesgo.
evaluation:
  primary_split: test
  validation_split: validation
  primary_level: vehicle
  secondary_level: window_scores_descriptive
  metrics:
  - precision
  - recall
  - f1_score
  - roc_auc
  - pr_auc
professional_execution:
  recommended_flow:
  - prepare_once
  - run_lstm
  - run_cnn_lstm
  - run_transformer
  - compare
  - report
  - study_summary
  train_all_models_together: false
  run_scoped_artifacts: true
  working_windows_are_shared_cache: true
  reason: Cada --run-name conserva modelos, metricas, predicciones, tablas, figuras,
    logs y manifiestos sin mezclar experimentos.
comparison:
  allow_partial: false
  primary_level: vehicle
  primary_metric: pr_auc
  secondary_metric: f1_score
